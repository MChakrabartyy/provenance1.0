# Copilot eval set. Placeholders: {as_of} = latest run date, {week} = 5 trading days before as_of, {day} = 1 trading day before.
# Numeric checks recompute the expected value with the engine directly and require the figure to match exactly.
- id: n1
  category: numeric
  user: tok-risk
  question: "Why is Manager C down this week?"
  expect: {confidence: answered, figures: [{label: "Total P&L", tool: get_pnl_attribution, args: {manager_id: C, start: "{week}", end: "{as_of}"}, path: total, format: money}]}
- id: n2
  category: numeric
  user: tok-pm-a
  question: "What drove my P&L this week?"
  expect: {confidence: answered, figures: [{label: "Total P&L", tool: get_pnl_attribution, args: {manager_id: A, start: "{week}", end: "{as_of}"}, path: total, format: money}, {label: "Realized", tool: get_pnl_attribution, args: {manager_id: A, start: "{week}", end: "{as_of}"}, path: realized, format: money}]}
- id: n3
  category: numeric
  user: tok-risk
  question: "What is our net exposure to semiconductors across all managers?"
  expect: {confidence: answered, figures: [{label: "Semiconductors net exposure", tool: get_exposure, args: {scope: firm, as_of: "{as_of}"}, path: "by_sector[sector=Semiconductors].net", format: money}]}
- id: n4
  category: numeric
  user: tok-risk
  question: "What is the firm's gross and net exposure?"
  expect: {confidence: answered, figures: [{label: "Gross exposure", tool: get_exposure, args: {scope: firm, as_of: "{as_of}"}, path: gross, format: money}, {label: "Net exposure", tool: get_exposure, args: {scope: firm, as_of: "{as_of}"}, path: net, format: money}]}
- id: n5
  category: numeric
  user: tok-pm-a
  question: "Show my top 5 positions by delta-adjusted exposure."
  expect: {confidence: answered, figure_count: 5, figures: [{label_index: 0, tool: get_positions, args: {manager_id: A, as_of: "{as_of}", top_n: 5}, path: "positions[0].delta_adjusted_exposure", format: money}]}
- id: n6
  category: numeric
  user: tok-pm-c
  question: "What is my sector exposure?"
  expect: {confidence: answered, figures: [{label: "Gross exposure", tool: get_exposure, args: {scope: C, as_of: "{as_of}"}, path: gross, format: money}]}
- id: n7
  category: numeric
  user: tok-risk
  question: "How did Manager B perform today?"
  expect: {confidence: answered, figures: [{label: "Total P&L", tool: get_pnl_attribution, args: {manager_id: B, start: "{day}", end: "{as_of}"}, path: total, format: money}]}
- id: n8
  category: numeric
  user: tok-risk
  question: "Where is the firm concentrated?"
  expect: {confidence: answered, figures: [{label_index: 0, tool: get_concentration, args: {as_of: "{as_of}"}, path: "largest_names[0].pct_of_gross", format: pct}]}
- id: n9
  category: numeric
  user: tok-pm-d
  question: "Show my top 3 positions"
  expect: {confidence: answered, figure_count: 3, figures: [{label_index: 2, tool: get_positions, args: {manager_id: D, as_of: "{as_of}", top_n: 3}, path: "positions[2].delta_adjusted_exposure", format: money}]}
- id: n10
  category: numeric
  user: tok-risk
  question: "What is Manager D's P&L this month?"
  expect: {confidence: answered, figures: [{label: "Total P&L", tool: get_pnl_attribution, args: {manager_id: D, start: "{month}", end: "{as_of}"}, path: total, format: money}]}

